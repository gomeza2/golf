name: Publish playable game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the playable browser game
        run: npm run build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_STATIC_HOST: "true"
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - run: npx playwright install --with-deps chromium
      - name: Verify a configured public online server before publishing
        run: node --import tsx scripts/verify-configured-online.ts
      - name: Verify the production build under the Pages path
        run: npm run test:pages
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish the game
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the live public game
        run: npm run test:pages
        env:
          PUBLIC_GAME_URL: ${{ steps.deployment.outputs.page_url }}
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - name: Save screenshots of the public game
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-game-screenshots
          path: work/pages-*.png
          if-no-files-found: ignore
