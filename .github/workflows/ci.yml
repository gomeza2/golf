name: Verify game
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Save local browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
      - name: Save first-play screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-play-desktop-mobile
          path: |
            work/welcome-*.png
            work/controls-*.png
            work/wildlands-*.png
            work/workshop-editions-*.png
            work/workshop-resources-*.png
            work/editor3d-*.png
            work/expeditions-*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Build for GitHub Pages
        run: npm run build
        env:
          PAGES_BASE_PATH: /golf/
          VITE_STATIC_HOST: "true"
      - run: npm run test:pages
  community:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: golf_test
          POSTGRES_PASSWORD: community_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d golf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_COMMUNITY_DATABASE_URL: postgresql://postgres:community_test_only@127.0.0.1:5432/golf_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:community
      - run: npx playwright install --with-deps chromium
      - run: npm run test:community:e2e
      - name: Save community test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: community-failure-diagnostics
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
