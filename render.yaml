services:
  - type: web
    name: hoyo-en-uno-golf-club
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://gomeza2.github.io
      - key: MAX_PLAYERS
        value: 8
      - key: DISCONNECT_GRACE_SECONDS
        value: 90
